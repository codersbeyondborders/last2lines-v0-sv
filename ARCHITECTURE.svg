<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .layer-title { font-size: 14px; font-weight: bold; fill: #1f2937; }
      .layer-text { font-size: 12px; fill: #374151; }
      .layer-label { font-size: 11px; fill: #6b7280; }
      .arrow { stroke: #9ca3af; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .box { stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#f9fafb"/>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" style="font-size: 24px; font-weight: bold; fill: #1f2937;">
    Last2Lines — Production Architecture on Vercel
  </text>

  <!-- Layer 1: Client -->
  <rect x="50" y="80" width="1300" height="80" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="70" y="105" class="layer-title">Client Layer</text>
  <text x="70" y="125" class="layer-text">Browser Requests • Web Vitals Tracking (Speed Insights) • User Analytics Collection</text>
  <text x="70" y="145" class="layer-label">Vercel's CDN edge nodes detect geography and route requests to optimal edge location</text>

  <!-- Arrow 1 -->
  <path d="M 700 160 L 700 200" class="arrow"/>

  <!-- Layer 2: Vercel Edge -->
  <rect x="50" y="200" width="1300" height="100" class="box" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="70" y="225" class="layer-title">Vercel Edge (Middleware + ISR Cache + OG Images)</text>
  <text x="70" y="245" class="layer-text">Middleware (Edge Runtime): Supabase session refresh only on /dashboard, /admin, /auth, /api routes</text>
  <text x="70" y="260" class="layer-text">ISR Cache: 60s (homepage), 30s (campaigns), 86400s (static). Invocation Shielding active.</text>
  <text x="70" y="275" class="layer-text">OG Image Generation: Dynamic social preview images via opengraph-image.tsx</text>
  <text x="70" y="290" class="layer-label">Skew Protection enabled: prevents stale client JS from mismatching new deployments</text>

  <!-- Arrow 2 -->
  <path d="M 700 300 L 700 340" class="arrow"/>

  <!-- Layer 3: Next.js Pages -->
  <g>
    <rect x="50" y="340" width="620" height="100" class="box" fill="#ddd6fe" stroke="#8b5cf6"/>
    <text x="70" y="365" class="layer-title">Next.js Pages (RSC + Streaming SSR)</text>
    <text x="70" y="385" class="layer-text">Public: /, /campaign/[slug], /about, /contact, /terms, /visualize</text>
    <text x="70" y="400" class="layer-text">Protected: /dashboard/*, /admin/* (require Supabase auth)</text>
    <text x="70" y="415" class="layer-text">loading.tsx: Skeleton UI renders instantly, data fetches in parallel</text>
    <text x="70" y="430" class="layer-label">Streaming boundaries with Suspense reduce TTFB to 200–300ms</text>

    <rect x="730" y="340" width="620" height="100" class="box" fill="#fce7f3" stroke="#ec4899"/>
    <text x="750" y="365" class="layer-title">API Routes (Auth + Transactional)</text>
    <text x="750" y="385" class="layer-text">Auth: /auth/callback (Supabase), /verify-otp, /send-otp, /send-verification-email</text>
    <text x="750" y="400" class="layer-text">Upload: /api/upload (Vercel Blob, 30s timeout)</text>
    <text x="750" y="415" class="layer-text">Admin: /api/migrate-otps, /api/seed-campaigns (60s timeout)</text>
    <text x="750" y="430" class="layer-label">All responses: Cache-Control: no-cache, no-store, must-revalidate</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 360 440 L 360 480" class="arrow"/>
  <path d="M 1040 440 L 1040 480" class="arrow"/>

  <!-- Layer 4: Database -->
  <rect x="50" y="480" width="1300" height="100" class="box" fill="#fecaca" stroke="#f87171"/>
  <text x="70" y="505" class="layer-title">AWS RDS Aurora PostgreSQL (with Connection Pooling)</text>
  <text x="70" y="525" class="layer-text">attachDatabasePool() manages connections across serverless invocations</text>
  <text x="70" y="540" class="layer-text">withConnection() helper ensures atomic transactions on same client</text>
  <text x="70" y="555" class="layer-text">SSL enabled: rejectUnauthorized = false; Principle of Least Privilege (IAM OIDC)</text>
  <text x="70" y="570" class="layer-label">Tables: campaigns, contributions, email_otps, verification_tokens</text>

  <!-- Arrow 4 -->
  <path d="M 700 580 L 700 620" class="arrow"/>

  <!-- Layer 5: External Services -->
  <g>
    <rect x="50" y="620" width="400" height="100" class="box" fill="#dbeafe" stroke="#0ea5e9"/>
    <text x="70" y="645" class="layer-title">Email Service</text>
    <text x="70" y="665" class="layer-text">Resend API: OTP codes, verification links, email notifications</text>
    <text x="70" y="680" class="layer-text">Integrated via /api/send-otp and /api/send-verification-email</text>
    <text x="70" y="695" class="layer-text">Retries on failure; error alerts to Sentry via @vercel/otel</text>
    <text x="70" y="710" class="layer-label">Max timeout: 10s</text>

    <rect x="500" y="620" width="400" height="100" class="box" fill="#bbf7d0" stroke="#10b981"/>
    <text x="520" y="645" class="layer-title">File Storage</text>
    <text x="520" y="665" class="layer-text">Vercel Blob: Campaign images, user-uploaded assets</text>
    <text x="520" y="680" class="layer-text">Integrated via /api/upload; images optimized via next/image</text>
    <text x="520" y="695" class="layer-text">AVIF/WebP formats; responsive optimization per device</text>
    <text x="520" y="710" class="layer-label">Max timeout: 30s</text>

    <rect x="950" y="620" width="400" height="100" class="box" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="970" y="645" class="layer-title">Observability</text>
    <text x="970" y="665" class="layer-text">@vercel/otel: Traces, spans, error attribution across Supabase + Resend</text>
    <text x="970" y="680" class="layer-text">instrumentation.ts: Service registration with propagated context</text>
    <text x="970" y="695" class="layer-text">Speed Insights: LCP, INP, CLS in production; Web Analytics: funnel tracking</text>
    <text x="970" y="710" class="layer-label">Vercel Dashboard + Sentry integration</text>
  </g>

  <!-- Arrow 5 -->
  <path d="M 700 720 L 700 760" class="arrow"/>

  <!-- Layer 6: Performance and Security -->
  <rect x="50" y="760" width="1300" height="100" class="box" fill="#e9d5ff" stroke="#a855f7"/>
  <text x="70" y="785" class="layer-title">Performance, Security, and Caching Strategy</text>
  <text x="70" y="805" class="layer-text">Fluid Compute (maxDuration): Auto-scales function runtime; 10s (auth/DB), 30s (upload), 60s (migrations) prevent cold starts</text>
  <text x="70" y="820" class="layer-text">Skew Protection: deploymentId pins assets to exact deployment; Image Optimization: WebP/AVIF + responsive sizing</text>
  <text x="70" y="835" class="layer-text">ISR Cache Shield: During traffic surges, only one function instance fetches; others serve cached response</text>
  <text x="70" y="850" class="layer-label">Combined: handles 100 to 100K concurrent users without architectural changes</text>
</svg>
