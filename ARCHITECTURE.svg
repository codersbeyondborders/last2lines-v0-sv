<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Define styles -->
  <defs>
    <style>
      .box { fill: #f5f5f5; stroke: #1a1a1a; stroke-width: 2; }
      .box-primary { fill: #1a8917; stroke: #0d5a0d; stroke-width: 2; }
      .box-secondary { fill: #0ea5e9; stroke: #0369a1; stroke-width: 2; }
      .box-tertiary { fill: #8b5cf6; stroke: #6d28d9; stroke-width: 2; }
      .box-warning { fill: #f59e0b; stroke: #d97706; stroke-width: 2; }
      .box-external { fill: #ec4899; stroke: #be123c; stroke-width: 2; }
      .text-primary { font-size: 14px; font-weight: bold; fill: #1a1a1a; font-family: Arial, sans-serif; }
      .text-white { font-size: 14px; font-weight: bold; fill: white; font-family: Arial, sans-serif; }
      .text-small { font-size: 12px; fill: #1a1a1a; font-family: Arial, sans-serif; }
      .text-small-white { font-size: 12px; fill: white; font-family: Arial, sans-serif; }
      .label { font-size: 11px; fill: #666; font-family: Arial, sans-serif; font-style: italic; }
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; font-family: Arial, sans-serif; }
      .section-title { font-size: 16px; font-weight: bold; fill: #1a1a1a; font-family: Arial, sans-serif; }
      .arrow { stroke: #1a1a1a; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-edge { stroke: #0ea5e9; stroke-width: 2; fill: none; marker-end: url(#arrowhead-edge); stroke-dasharray: 5,5; }
      .arrow-cache { stroke: #8b5cf6; stroke-width: 2; fill: none; marker-end: url(#arrowhead-cache); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1a1a1a" />
    </marker>
    <marker id="arrowhead-edge" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0ea5e9" />
    </marker>
    <marker id="arrowhead-cache" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b5cf6" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="40" text-anchor="middle" class="title">Last2Lines Architecture - Production Stack</text>

  <!-- ============ CLIENT LAYER ============ -->
  <text x="20" y="90" class="section-title">🌐 Client Layer</text>

  <!-- Browser/Client -->
  <rect x="50" y="110" width="140" height="60" class="box"/>
  <text x="120" y="135" text-anchor="middle" class="text-primary">Browser</text>
  <text x="120" y="155" text-anchor="middle" class="text-small">(User Client)</text>

  <!-- ============ VERCEL EDGE/CDN ============ -->
  <text x="320" y="90" class="section-title">⚡ Vercel Edge/CDN</text>

  <!-- Middleware (Edge) -->
  <rect x="280" y="110" width="160" height="60" class="box-secondary"/>
  <text x="360" y="130" text-anchor="middle" class="text-white">Middleware</text>
  <text x="360" y="150" text-anchor="middle" class="text-small-white">(Edge Runtime)</text>
  <text x="360" y="165" text-anchor="middle" class="label">Session refresh</text>

  <!-- ISR Cache -->
  <rect x="520" y="110" width="140" height="60" class="box-tertiary"/>
  <text x="590" y="135" text-anchor="middle" class="text-white">ISR Cache</text>
  <text x="590" y="155" text-anchor="middle" class="text-small-white">30-86400s</text>

  <!-- OG Images -->
  <rect x="740" y="110" width="140" height="60" class="box-tertiary"/>
  <text x="810" y="135" text-anchor="middle" class="text-white">OG Images</text>
  <text x="810" y="155" text-anchor="middle" class="text-small-white">(on-demand)</text>

  <!-- ============ API ROUTES (Serverless Functions) ============ -->
  <text x="20" y="240" class="section-title">🔧 API Routes (Serverless Functions)</text>

  <!-- Auth Routes -->
  <rect x="50" y="260" width="130" height="80" class="box-warning"/>
  <text x="115" y="280" text-anchor="middle" class="text-white">Auth Routes</text>
  <text x="115" y="300" text-anchor="middle" class="text-small-white">/auth/callback</text>
  <text x="115" y="318" text-anchor="middle" class="label">maxDuration: 10s</text>
  <text x="115" y="332" text-anchor="middle" class="label">no-cache headers</text>

  <!-- OTP Routes -->
  <rect x="230" y="260" width="130" height="80" class="box-warning"/>
  <text x="295" y="280" text-anchor="middle" class="text-white">OTP Routes</text>
  <text x="295" y="300" text-anchor="middle" class="text-small-white">/send-otp</text>
  <text x="295" y="315" text-anchor="middle" class="text-small-white">/verify-otp</text>
  <text x="295" y="332" text-anchor="middle" class="label">maxDuration: 10s</text>

  <!-- Email Routes -->
  <rect x="410" y="260" width="140" height="80" class="box-warning"/>
  <text x="480" y="280" text-anchor="middle" class="text-white">Email Routes</text>
  <text x="480" y="300" text-anchor="middle" class="text-small-white">/send-verification</text>
  <text x="480" y="318" text-anchor="middle" class="label">maxDuration: 10s</text>
  <text x="480" y="332" text-anchor="middle" class="label">Resend API call</text>

  <!-- Upload Routes -->
  <rect x="600" y="260" width="130" height="80" class="box-warning"/>
  <text x="665" y="280" text-anchor="middle" class="text-white">Upload Routes</text>
  <text x="665" y="300" text-anchor="middle" class="text-small-white">/upload</text>
  <text x="665" y="318" text-anchor="middle" class="label">maxDuration: 30s</text>
  <text x="665" y="332" text-anchor="middle" class="label">Blob storage</text>

  <!-- Admin Routes -->
  <rect x="780" y="260" width="140" height="80" class="box-warning"/>
  <text x="850" y="280" text-anchor="middle" class="text-white">Admin Routes</text>
  <text x="850" y="300" text-anchor="middle" class="text-small-white">/migrate-otps</text>
  <text x="850" y="315" text-anchor="middle" class="text-small-white">/seed-campaigns</text>
  <text x="850" y="332" text-anchor="middle" class="label">maxDuration: 60s</text>

  <!-- ============ NEXT.JS PAGES (RSCs) ============ -->
  <text x="20" y="420" class="section-title">📄 Next.js Pages (React Server Components)</text>

  <!-- Homepage -->
  <rect x="50" y="440" width="130" height="70" class="box-primary"/>
  <text x="115" y="460" text-anchor="middle" class="text-white">Homepage</text>
  <text x="115" y="480" text-anchor="middle" class="text-small-white">Streaming SSR</text>
  <text x="115" y="495" text-anchor="middle" class="label">revalidate: 60s</text>

  <!-- Campaign Pages -->
  <rect x="230" y="440" width="130" height="70" class="box-primary"/>
  <text x="295" y="460" text-anchor="middle" class="text-white">Campaign Pages</text>
  <text x="295" y="480" text-anchor="middle" class="text-small-white">/campaign/[slug]</text>
  <text x="295" y="495" text-anchor="middle" class="label">revalidate: 30s</text>

  <!-- Static Pages -->
  <rect x="410" y="440" width="130" height="70" class="box-primary"/>
  <text x="475" y="460" text-anchor="middle" class="text-white">Static Pages</text>
  <text x="475" y="480" text-anchor="middle" class="text-small-white">/about /contact</text>
  <text x="475" y="495" text-anchor="middle" class="label">revalidate: 86400s</text>

  <!-- Protected Pages -->
  <rect x="590" y="440" width="130" height="70" class="box-primary"/>
  <text x="655" y="460" text-anchor="middle" class="text-white">Protected Pages</text>
  <text x="655" y="480" text-anchor="middle" class="text-small-white">/dashboard</text>
  <text x="655" y="495" text-anchor="middle" class="label">force-dynamic</text>

  <!-- ============ OBSERVABILITY ============ -->
  <text x="780" y="420" class="section-title">📊 Observability</text>

  <!-- OTEL -->
  <rect x="780" y="440" width="140" height="70" class="box-secondary"/>
  <text x="850" y="460" text-anchor="middle" class="text-white">@vercel/otel</text>
  <text x="850" y="480" text-anchor="middle" class="text-small-white">OpenTelemetry</text>
  <text x="850" y="495" text-anchor="middle" class="label">Tracing all requests</text>

  <!-- ============ DATABASE LAYER ============ -->
  <text x="20" y="610" class="section-title">🗄️ Database Layer</text>

  <!-- PostgreSQL (AWS RDS) -->
  <rect x="50" y="630" width="180" height="100" class="box-primary"/>
  <text x="140" y="655" text-anchor="middle" class="text-white">PostgreSQL</text>
  <text x="140" y="675" text-anchor="middle" class="text-small-white">(AWS RDS)</text>
  <text x="140" y="695" text-anchor="middle" class="label">attachDatabasePool</text>
  <text x="140" y="710" text-anchor="middle" class="label">withConnection txns</text>
  <text x="140" y="725" text-anchor="middle" class="label">SSL: rejectUnauthorized</text>

  <!-- Connection Library -->
  <rect x="300" y="630" width="160" height="100" class="box"/>
  <text x="380" y="655" text-anchor="middle" class="text-primary">DB Client</text>
  <text x="380" y="675" text-anchor="middle" class="text-small">lib/db.ts</text>
  <text x="380" y="695" text-anchor="middle" class="label">pg + IAM auth</text>
  <text x="380" y="710" text-anchor="middle" class="label">connection pooling</text>
  <text x="380" y="725" text-anchor="middle" class="label">transactions support</text>

  <!-- Tables -->
  <rect x="540" y="630" width="140" height="100" class="box"/>
  <text x="610" y="655" text-anchor="middle" class="text-primary">Tables</text>
  <text x="610" y="675" text-anchor="middle" class="text-small">campaigns</text>
  <text x="610" y="690" text-anchor="middle" class="text-small">contributions</text>
  <text x="610" y="705" text-anchor="middle" class="text-small">email_otps</text>
  <text x="610" y="720" text-anchor="middle" class="text-small">email_verifications</text>

  <!-- ============ EXTERNAL SERVICES ============ -->
  <text x="780" y="610" class="section-title">🌍 External Services</text>

  <!-- Resend -->
  <rect x="780" y="630" width="130" height="70" class="box-external"/>
  <text x="845" y="655" text-anchor="middle" class="text-white">Resend</text>
  <text x="845" y="675" text-anchor="middle" class="text-small-white">Email Service</text>
  <text x="845" y="690" text-anchor="middle" class="label">OTP + Verification</text>

  <!-- Vercel Blob -->
  <rect x="970" y="630" width="130" height="70" class="box-external"/>
  <text x="1035" y="655" text-anchor="middle" class="text-white">Vercel Blob</text>
  <text x="1035" y="675" text-anchor="middle" class="text-small-white">File Storage</text>
  <text x="1035" y="690" text-anchor="middle" class="label">Campaign images</text>

  <!-- ============ SECURITY & PERFORMANCE ============ -->
  <text x="20" y="810" class="section-title">🔒 Security & Performance Features</text>

  <!-- Skew Protection -->
  <rect x="50" y="830" width="140" height="70" class="box-secondary"/>
  <text x="120" y="850" text-anchor="middle" class="text-white">Skew Protection</text>
  <text x="120" y="870" text-anchor="middle" class="text-small-white">deploymentId</text>
  <text x="120" y="885" text-anchor="middle" class="label">Asset pinning</text>

  <!-- Speed Insights -->
  <rect x="250" y="830" width="140" height="70" class="box-secondary"/>
  <text x="320" y="850" text-anchor="middle" class="text-white">Speed Insights</text>
  <text x="320" y="870" text-anchor="middle" class="text-small-white">Web Vitals</text>
  <text x="320" y="885" text-anchor="middle" class="label">LCP, INP, CLS</text>

  <!-- Web Analytics -->
  <rect x="450" y="830" width="140" height="70" class="box-secondary"/>
  <text x="520" y="850" text-anchor="middle" class="text-white">Web Analytics</text>
  <text x="520" y="870" text-anchor="middle" class="text-small-white">User Tracking</text>
  <text x="520" y="885" text-anchor="middle" class="label">Conversion funnels</text>

  <!-- Image Optimization -->
  <rect x="650" y="830" width="140" height="70" class="box-secondary"/>
  <text x="720" y="850" text-anchor="middle" class="text-white">Image Optimization</text>
  <text x="720" y="870" text-anchor="middle" class="text-small-white">AVIF/WebP</text>
  <text x="720" y="885" text-anchor="middle" class="label">Adaptive serving</text>

  <!-- Middleware Security -->
  <rect x="850" y="830" width="140" height="70" class="box-secondary"/>
  <text x="920" y="850" text-anchor="middle" class="text-white">Auth Middleware</text>
  <text x="920" y="870" text-anchor="middle" class="text-small-white">(Edge Runtime)</text>
  <text x="920" y="885" text-anchor="middle" class="label">Session refresh</text>

  <!-- ============ ARROWS / CONNECTIONS ============ -->

  <!-- Client to Middleware -->
  <line x1="190" y1="140" x2="280" y2="140" class="arrow"/>

  <!-- Middleware to ISR Cache -->
  <line x1="440" y1="140" x2="520" y2="140" class="arrow"/>

  <!-- Middleware to API Routes -->
  <line x1="360" y1="170" x2="115" y2="260" class="arrow"/>
  <line x1="360" y1="170" x2="295" y2="260" class="arrow"/>
  <line x1="360" y1="170" x2="480" y2="260" class="arrow"/>

  <!-- Client to Pages -->
  <line x1="120" y1="170" x2="115" y2="440" class="arrow"/>

  <!-- API Routes to Database -->
  <line x1="115" y1="340" x2="140" y2="630" class="arrow"/>
  <line x1="295" y1="340" x2="140" y2="630" class="arrow"/>
  <line x1="480" y1="340" x2="140" y2="630" class="arrow"/>

  <!-- API Routes to External Services -->
  <line x1="480" y1="340" x2="845" y2="630" class="arrow"/>
  <line x1="665" y1="340" x2="1035" y2="630" class="arrow"/>

  <!-- Pages to Database -->
  <line x1="115" y1="510" x2="140" y2="630" class="arrow"/>
  <line x1="295" y1="510" x2="140" y2="630" class="arrow"/>

  <!-- Pages to Observability -->
  <line x1="720" y1="475" x2="780" y2="475" class="arrow"/>

  <!-- OTEL to external -->
  <line x1="920" y1="510" x2="920" y2="610" class="arrow-cache"/>

  <!-- Database Client connections -->
  <line x1="230" y1="680" x2="300" y2="680" class="arrow"/>

  <!-- Legend -->
  <text x="20" y="955" class="label">Legend:</text>
  <rect x="130" y="935" width="20" height="20" class="box-primary"/>
  <text x="160" y="950" class="label">Backend Logic</text>

  <rect x="330" y="935" width="20" height="20" class="box-secondary"/>
  <text x="360" y="950" class="label">Edge/Vercel Services</text>

  <rect x="580" y="935" width="20" height="20" class="box-tertiary"/>
  <text x="610" y="950" class="label">Caching Layer</text>

  <rect x="820" y="935" width="20" height="20" class="box-warning"/>
  <text x="850" y="950" class="label">Serverless Functions</text>

  <rect x="1070" y="935" width="20" height="20" class="box-external"/>
  <text x="1100" y="950" class="label">External APIs</text>
</svg>
