<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <defs>
    <style>
      .layer-label { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
      .box { stroke-width: 2; }
      .client-box { fill: #e8f5e9; stroke: #2e7d32; }
      .vercel-box { fill: #e3f2fd; stroke: #1565c0; }
      .cache-box { fill: #f3e5f5; stroke: #6a1b9a; }
      .function-box { fill: #fff3e0; stroke: #e65100; }
      .db-box { fill: #fce4ec; stroke: #c2185b; }
      .external-box { fill: #ede7f6; stroke: #512da8; }
      .text-label { font-size: 12px; fill: #1a1a1a; text-anchor: middle; }
      .connector { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .connector-label { font-size: 10px; fill: #666; }
      .section-title { font-size: 16px; font-weight: bold; fill: #1a1a1a; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666" />
    </marker>
  </defs>

  <!-- Background sections -->
  <rect x="10" y="10" width="380" height="880" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5" opacity="0.3"/>
  <rect x="400" y="10" width="500" height="880" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5" opacity="0.3"/>
  <rect x="910" y="10" width="480" height="880" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="5" opacity="0.3"/>

  <!-- Section titles -->
  <text x="200" y="35" class="section-title">CLIENT & CDN</text>
  <text x="650" y="35" class="section-title">VERCEL EDGE & SERVERLESS</text>
  <text x="1150" y="35" class="section-title">BACKEND & SERVICES</text>

  <!-- ==================== LAYER 1: CLIENT ==================== -->
  <rect x="30" y="60" width="140" height="60" class="box client-box" rx="5"/>
  <text x="100" y="85" class="text-label">Browser</text>
  <text x="100" y="103" class="text-label" font-size="10">Request</text>

  <!-- ==================== LAYER 2: VERCEL EDGE ==================== -->
  <!-- Middleware -->
  <rect x="420" y="60" width="120" height="60" class="box vercel-box" rx="5"/>
  <text x="480" y="85" class="text-label">Middleware</text>
  <text x="480" y="103" class="text-label" font-size="10">(Edge Runtime)</text>

  <!-- ISR Cache -->
  <rect x="600" y="60" width="120" height="60" class="box cache-box" rx="5"/>
  <text x="660" y="85" class="text-label">ISR Cache</text>
  <text x="660" y="103" class="text-label" font-size="10">Vercel Edge</text>

  <!-- OG Image Gen -->
  <rect x="780" y="60" width="120" height="60" class="box vercel-box" rx="5"/>
  <text x="840" y="85" class="text-label">OG Images</text>
  <text x="840" y="103" class="text-label" font-size="10">next/og</text>

  <!-- Connectors from browser to edge -->
  <path d="M 170 90 L 420 90" class="connector"/>
  <text x="295" y="85" class="connector-label">Route matching</text>

  <!-- ==================== LAYER 3: NEXTJS PAGES ==================== -->
  <!-- Public Pages -->
  <rect x="30" y="170" width="360" height="100" class="box vercel-box" rx="5"/>
  <text x="210" y="195" class="text-label" font-size="12">Public Pages (ISR + Streaming)</text>
  <rect x="45" y="205" width="80" height="35" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="85" y="228" class="text-label" font-size="10">/ (60s)</text>

  <rect x="135" y="205" width="80" height="35" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="175" y="228" class="text-label" font-size="10">/campaign (30s)</text>

  <rect x="225" y="205" width="80" height="35" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="265" y="228" class="text-label" font-size="10">/about (24h)</text>

  <rect x="315" y="205" width="80" height="35" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="355" y="228" class="text-label" font-size="10">loading.tsx</text>

  <!-- Protected Pages -->
  <rect x="30" y="290" width="360" height="80" class="box vercel-box" rx="5"/>
  <text x="210" y="315" class="text-label" font-size="12">Protected Pages (Auth Required)</text>
  <rect x="45" y="335" width="160" height="25" class="box vercel-box" rx="3" stroke-width="1"/>
  <text x="125" y="352" class="text-label" font-size="10">/dashboard</text>

  <rect x="225" y="335" width="160" height="25" class="box vercel-box" rx="3" stroke-width="1"/>
  <text x="305" y="352" class="text-label" font-size="10">/admin</text>

  <!-- Connectors -->
  <path d="M 100 120 L 100 170" class="connector"/>
  <text x="65" y="150" class="connector-label">Public</text>

  <path d="M 660 120 L 660 170" class="connector"/>
  <text x="625" y="150" class="connector-label">Cached</text>

  <path d="M 480 120 L 120 290" class="connector"/>
  <text x="280" y="200" class="connector-label">Session check</text>

  <!-- ==================== LAYER 4: API ROUTES ==================== -->
  <!-- API Routes -->
  <rect x="420" y="170" width="470" height="200" class="box function-box" rx="5"/>
  <text x="655" y="195" class="text-label" font-size="12">API Routes (Fluid Compute)</text>

  <!-- Auth & Email -->
  <rect x="435" y="210" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="485" y="233" class="text-label" font-size="10">send-otp (10s)</text>

  <rect x="545" y="210" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="595" y="233" class="text-label" font-size="10">verify-otp (10s)</text>

  <rect x="655" y="210" width="110" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="710" y="233" class="text-label" font-size="10">send-email (10s)</text>

  <rect x="775" y="210" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="825" y="233" class="text-label" font-size="10">callback (10s)</text>

  <!-- Upload & Admin -->
  <rect x="435" y="265" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="485" y="288" class="text-label" font-size="10">upload (30s)</text>

  <rect x="545" y="265" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="595" y="288" class="text-label" font-size="10">migrate (60s)</text>

  <rect x="655" y="265" width="110" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="710" y="288" class="text-label" font-size="10">seed-data (60s)</text>

  <rect x="775" y="265" width="100" height="40" class="box function-box" rx="3" stroke-width="1"/>
  <text x="825" y="288" class="text-label" font-size="10">verify-email</text>

  <!-- Cache Headers note -->
  <rect x="435" y="315" width="440" height="40" fill="none" stroke="#e65100" stroke-width="1" stroke-dasharray="4,4" rx="3"/>
  <text x="655" y="335" class="text-label" font-size="10">All responses: Cache-Control: no-cache, no-store, must-revalidate</text>

  <!-- Connectors -->
  <path d="M 210 370 L 500 170" class="connector"/>
  <text x="340" y="260" class="connector-label">Middleware</text>

  <!-- ==================== LAYER 5: DATABASE ==================== -->
  <!-- PostgreSQL with pooling -->
  <rect x="930" y="60" width="200" height="100" class="box db-box" rx="5"/>
  <text x="1030" y="85" class="text-label">PostgreSQL</text>
  <text x="1030" y="103" class="text-label" font-size="10">AWS Aurora</text>
  <text x="1030" y="121" class="text-label" font-size="10">+ Connection Pool</text>

  <!-- Connector from API to DB -->
  <path d="M 890 250 L 930 120" class="connector"/>
  <text x="895" y="180" class="connector-label">Queries with</text>
  <text x="895" y="195" class="connector-label">withConnection</text>

  <!-- ==================== LAYER 6: EXTERNAL SERVICES ==================== -->
  <!-- Resend -->
  <rect x="930" y="200" width="200" height="80" class="box external-box" rx="5"/>
  <text x="1030" y="230" class="text-label" font-size="12">Resend</text>
  <text x="1030" y="250" class="text-label" font-size="10">Email Service</text>
  <path d="M 890 230 L 930 230" class="connector"/>

  <!-- Vercel Blob -->
  <rect x="930" y="310" width="200" height="80" class="box external-box" rx="5"/>
  <text x="1030" y="340" class="text-label" font-size="12">Vercel Blob</text>
  <text x="1030" y="360" class="text-label" font-size="10">File Storage</text>
  <path d="M 890 290 L 930 350" class="connector"/>

  <!-- ==================== LAYER 7: OBSERVABILITY ==================== -->
  <rect x="930" y="420" width="440" height="120" class="box vercel-box" rx="5"/>
  <text x="1150" y="445" class="text-label" font-size="12">Observability &amp; Monitoring</text>

  <rect x="945" y="460" width="130" height="30" class="box vercel-box" rx="3" stroke-width="1"/>
  <text x="1010" y="480" class="text-label" font-size="10">@vercel/otel</text>

  <rect x="1085" y="460" width="130" height="30" class="box vercel-box" rx="3" stroke-width="1"/>
  <text x="1150" y="480" class="text-label" font-size="10">Speed Insights</text>

  <rect x="1225" y="460" width="130" height="30" class="box vercel-box" rx="3" stroke-width="1"/>
  <text x="1290" y="480" class="text-label" font-size="10">Web Analytics</text>

  <text x="1150" y="510" class="text-label" font-size="10">Tracing • Error Attribution • Core Web Vitals</text>

  <!-- Connector from API to observability -->
  <path d="M 890 200 L 930 480" class="connector"/>
  <text x="895" y="340" class="connector-label">Instrumentation</text>

  <!-- ==================== LAYER 8: PERFORMANCE FEATURES ==================== -->
  <rect x="930" y="570" width="440" height="110" class="box cache-box" rx="5"/>
  <text x="1150" y="595" class="text-label" font-size="12">Performance &amp; Security</text>

  <rect x="945" y="610" width="100" height="30" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="995" y="630" class="text-label" font-size="10">Skew Protect</text>

  <rect x="1055" y="610" width="100" height="30" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="1105" y="630" class="text-label" font-size="10">Image Opt</text>

  <rect x="1165" y="610" width="100" height="30" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="1215" y="630" class="text-label" font-size="10">SSL/RLS</text>

  <rect x="1275" y="610" width="100" height="30" class="box cache-box" rx="3" stroke-width="1"/>
  <text x="1325" y="630" class="text-label" font-size="10">Edge Middleware</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="30" y="700" width="1340" height="180" class="box" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="5"/>

  <text x="50" y="730" class="section-title">Architecture Features by Layer</text>

  <text x="50" y="765" class="text-label" font-size="11" text-anchor="start" font-weight="bold">Client Layer:</text>
  <text x="50" y="785" class="text-label" font-size="10" text-anchor="start">Browser sends requests → Vercel Edge processes routing</text>

  <text x="50" y="810" class="text-label" font-size="11" text-anchor="start" font-weight="bold">Edge Layer:</text>
  <text x="50" y="830" class="text-label" font-size="10" text-anchor="start">Middleware (narrowed matcher) validates sessions on protected routes only • ISR serves cached pages • OG images generated on-demand</text>

  <text x="700" y="765" class="text-label" font-size="11" text-anchor="start" font-weight="bold">Serverless Layer:</text>
  <text x="700" y="785" class="text-label" font-size="10" text-anchor="start">All API routes have maxDuration timeouts • Responses include Cache-Control headers to prevent stale state</text>

  <text x="700" y="810" class="text-label" font-size="11" text-anchor="start" font-weight="bold">Backend Layer:</text>
  <text x="700" y="830" class="text-label" font-size="10" text-anchor="start">PostgreSQL with connection pooling • withConnection helper for atomic transactions • SSL encryption • @vercel/otel tracing across all services</text>

  <!-- Version info -->
  <text x="700" y="855" class="text-label" font-size="9" text-anchor="start" fill="#999">Last2Lines v0 • Vercel Optimized • AWS Aurora PostgreSQL • Production-Ready</text>
</svg>
